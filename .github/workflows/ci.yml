name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  CI: true

jobs:
  server:
    name: Server (build · unit · integration)
    runs-on: ubuntu-latest
    services:
      # 集成测试在 CI 里用 service container 而非 Testcontainers：
      # 免去每个 job 重复拉镜像，且 GitHub 已把它缓存在 runner 上。
      # 本地仍走 Testcontainers（开发者无需手工起库）—— 两边由同一个
      # ConnectionString 环境变量切换，测试代码不感知差异。
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nimpression_test
          POSTGRES_USER: nimpression
          POSTGRES_PASSWORD: ci_only
          TZ: Pacific/Auckland
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nimpression -d nimpression_test"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/server/Nimpression.slnx

      - name: Build
        run: dotnet build src/server/Nimpression.slnx --no-restore --nologo

      - name: Test with coverage
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=nimpression_test;Username=nimpression;Password=ci_only"
        run: >-
          dotnet test src/server/Nimpression.slnx --no-build --nologo --filter "Category!=Timing"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: ./artifacts/coverage

  web:
    name: Web (build · unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -F console exec ng build

      - name: Test
        run: pnpm -F console exec ng test --watch=false
