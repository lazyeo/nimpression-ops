<div class="chart-card">
  <div class="card-header">
    <div class="header-text">
      <div class="title-row">
        <span class="badge-tag">F14.3</span>
        <h3 class="card-title">{{ 'CHARTS.ODOMETER_TREND.TITLE' | i18n }}</h3>
      </div>
      <p class="card-subtitle">{{ 'CHARTS.ODOMETER_TREND.SUBTITLE' | i18n }}</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-action-icon" (click)="exportPng()" [title]="'CHARTS.COMMON.EXPORT_PNG_TITLE' | i18n">
        📷 {{ 'CHARTS.COMMON.EXPORT_PNG' | i18n }}
      </button>
    </div>
  </div>

  <div class="card-body">
    <nim-base-chart
      [options]="options()"
      [loading]="loading()"
      [error]="error()"
      [skeletonType]="'line'"
      [height]="height()"
      [exportFileName]="'odometer-trend-vehicles'"
      (retry)="retry.emit()"
    />
  </div>
</div>
