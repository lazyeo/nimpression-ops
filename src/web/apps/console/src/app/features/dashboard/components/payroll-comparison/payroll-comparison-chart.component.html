<div class="chart-card">
  <div class="card-header">
    <div class="header-text">
      <div class="title-row">
        <span class="badge-tag">F14.6</span>
        <h3 class="card-title">薪资对比分析</h3>
        <span class="period-pill">{{ currentPeriodLabel() }} vs {{ previousPeriodLabel() }}</span>
      </div>
      <p class="card-subtitle">本薪期 vs 上薪期按司机分组，含普通 / 加班 / 假期工时三段堆叠构成</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-action-icon" (click)="exportPng()" title="导出 PNG 图表">
        📷 导出 PNG
      </button>
    </div>
  </div>

  <div class="card-body">
    <nim-base-chart
      [options]="options()"
      [loading]="loading()"
      [error]="error()"
      [skeletonType]="'grouped-bar'"
      [height]="height()"
      [exportFileName]="'payroll-period-comparison'"
      (retry)="retry.emit()"
    />
  </div>
</div>
