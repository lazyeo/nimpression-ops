<div class="chart-card">
  <div class="card-header">
    <div class="header-text">
      <div class="title-row">
        <span class="badge-tag">F14.1</span>
        <h3 class="card-title">{{ 'CHARTS.FLEET_UTILIZATION.TITLE' | i18n }}</h3>
      </div>
      <p class="card-subtitle">{{ 'CHARTS.FLEET_UTILIZATION.SUBTITLE' | i18n }}</p>
    </div>
    <div class="header-actions">
      <button
        type="button"
        class="btn-action-icon"
        (click)="exportPng()"
        [title]="'CHARTS.COMMON.EXPORT_PNG_TITLE' | i18n"
      >
        <nim-icon name="camera" [size]="14" />
        <span>{{ 'CHARTS.COMMON.EXPORT_PNG' | i18n }}</span>
      </button>
    </div>
  </div>

  <div class="card-body">
    <nim-base-chart
      [options]="options()"
      [loading]="loading()"
      [error]="error()"
      [skeletonType]="'bar'"
      [height]="height()"
      [exportFileName]="'fleet-utilization-30d'"
      (chartClick)="onChartClick($event)"
      (retry)="retry.emit()"
    />
  </div>
</div>
