<div class="chart-card">
  <div class="card-header">
    <div class="header-text">
      <div class="title-row">
        <span class="badge-tag">F14.1</span>
        <h3 class="card-title">车队利用率</h3>
      </div>
      <p class="card-subtitle">近 30 天每日在途 / 闲置 / 维修车辆数分布（点击下钻查看当日任务）</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-action-icon" (click)="exportPng()" title="导出 PNG 图表">
        📷 导出 PNG
      </button>
    </div>
  </div>

  <div class="card-body">
    <nim-base-chart
      [options]="options()"
      [loading]="loading()"
      [error]="error()"
      [skeletonType]="'bar'"
      [height]="height()"
      [exportFileName]="'fleet-utilization-30d'"
      (chartClick)="onChartClick($event)"
      (retry)="retry.emit()"
    />
  </div>
</div>
