<div class="chart-card">
  <div class="card-header">
    <div class="header-text">
      <div class="title-row">
        <span class="badge-tag">F14.4</span>
        <h3 class="card-title">{{ 'CHARTS.FINES_COMPOSITION.TITLE' | i18n }}</h3>
        @if (selectedCategory()) {
          <span class="active-filter-badge">
            {{ 'CHARTS.FINES_COMPOSITION.FILTERED_BY' | i18n: { category: selectedCategory()! } }}
            <button type="button" class="btn-clear-tag" (click)="clearFilter()" [title]="'CHARTS.FINES_COMPOSITION.CLEAR_FILTER' | i18n">✕</button>
          </span>
        }
      </div>
      <p class="card-subtitle">{{ 'CHARTS.FINES_COMPOSITION.SUBTITLE' | i18n }}</p>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-action-icon" (click)="exportDoughnutPng()" [title]="'CHARTS.COMMON.EXPORT_PNG_TITLE' | i18n">
        📷 {{ 'CHARTS.FINES_COMPOSITION.EXPORT_DOUGHNUT' | i18n }}
      </button>
      <button type="button" class="btn-action-icon" (click)="exportRankingPng()" [title]="'CHARTS.COMMON.EXPORT_PNG_TITLE' | i18n">
        📷 {{ 'CHARTS.FINES_COMPOSITION.EXPORT_RANKING' | i18n }}
      </button>
    </div>
  </div>

  <div class="card-body multi-chart-grid">
    <div class="chart-sub-pane">
      <nim-base-chart
        #doughnutBase
        [options]="doughnutOptions()"
        [loading]="loading()"
        [error]="error()"
        [skeletonType]="'doughnut'"
        [height]="height()"
        [exportFileName]="'fines-composition-doughnut'"
        (chartClick)="onDoughnutClick($event)"
        (retry)="retry.emit()"
      />
    </div>

    <div class="chart-sub-pane">
      <nim-base-chart
        #rankingBase
        [options]="rankingOptions()"
        [loading]="loading()"
        [error]="error()"
        [skeletonType]="'bar'"
        [height]="height()"
        [exportFileName]="'fines-ranking-bar'"
        (retry)="retry.emit()"
      />
    </div>
  </div>
</div>
