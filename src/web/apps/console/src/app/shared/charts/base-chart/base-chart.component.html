<div class="base-chart-container" [style.height]="height()">
  @if (loading()) {
    <div class="state-overlay loading-state">
      <nim-chart-skeleton [type]="skeletonType()" [height]="height()" />
    </div>
  } @else if (error()) {
    <div class="state-overlay error-state">
      <div class="error-icon">⚠️</div>
      <div class="error-title">图表加载失败</div>
      <div class="error-message">{{ error() }}</div>
      <button type="button" class="btn-retry" (click)="onRetry()">重新加载</button>
    </div>
  } @else if (isEmpty() || !options()) {
    <div class="state-overlay empty-state">
      <div class="empty-icon">📊</div>
      <div class="empty-text">{{ emptyText() }}</div>
    </div>
  } @else {
    <div
      echarts
      class="echarts-host"
      [options]="options()!"
      [autoResize]="true"
      (chartInit)="onChartInit($event)"
      (chartClick)="onChartClick($event)"
    ></div>
  }
</div>
